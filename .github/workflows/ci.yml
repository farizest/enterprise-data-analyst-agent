name: AI Analyst Evaluation Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  evaluate-ai:
    runs-on: ubuntu-latest
    
    # 1. Spin up a temporary PostgreSQL database for the test
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: secretpassword
          POSTGRES_DB: adventureworks
        ports:
          - 5432:5432
          
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install -r requirements.txt

    - name: Run ETL Migration (SQLite to CI Postgres)
      env:
        DATABASE_URL: postgresql+psycopg2://admin:secretpassword@localhost:5432/adventureworks
      run: python src/migrate_db.py

    - name: Run Golden Set AI Evaluation
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        DATABASE_URL: postgresql+psycopg2://admin:secretpassword@localhost:5432/adventureworks
      run: python src/evaluate.py
      